[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dgxmm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pyyaml>=6",
  "sqlalchemy>=2.0.30",
  "argon2-cffi>=23.1",
  "docker>=7.1",
  "httpx>=0.27",
  "huggingface_hub>=0.25",
  "gguf>=0.10",
  "nvidia-ml-py>=12.560",
  "prometheus-client>=0.20",
  "llmfit>=1.1.17",
  "tzdata>=2024.1",  # IANA zones for zoneinfo where the image has no /usr/share/zoneinfo (wall-clock schedules)
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3"]

[tool.setuptools.packages.find]
include = ["dgxmm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60

# CI (.github/workflows/pylint.yml) runs `pylint --errors-only dgxmm`: real errors only, no style checks (the code
# follows the conventions in CONTRIBUTING.md). Disabled: inference false positives on attributes that start as None
# and are wired later (delete_guard, removal_hooks) and on pydantic's model_fields.
[tool.pylint.main]
py-version = "3.12"

[tool.pylint."messages control"]
disable = ["not-callable", "not-an-iterable", "unsupported-membership-test"]
