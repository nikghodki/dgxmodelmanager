# DGXMM service. Host-specific values come from .env (generated by ./install.sh; see .env keys
# below). Run ./install.sh rather than editing this file.
#
# Optional bundled LiteLLM (profile "litellm", enabled by ./install.sh --with-litellm, which also sets
# COMPOSE_PROFILES=litellm in .env): one OpenAI-compatible endpoint for every DGXMM deployment.
# Those services have no container_name, so their names derive from the compose project; DGXMM
# reaches LiteLLM by service name: http://dgxmm-litellm:4000.
services:
  dgxmm:
    build: .
    image: dgxmm:latest
    container_name: dgxmm
    restart: unless-stopped
    # Run as the host user that owns data/, secrets/ and the model caches.
    user: "${DGXMM_UID:?set DGXMM_UID in .env (run ./install.sh)}:${DGXMM_GID:?set DGXMM_GID in .env (run ./install.sh)}"
    group_add: ["${DOCKER_GID:?set DOCKER_GID (gid of /var/run/docker.sock) in .env (run ./install.sh)}"]
    runtime: nvidia               # NVML for per-process GPU memory / util
    environment:
      DGXMM_CONFIG: /app/config.yaml
      DGXMM_HOST_HOME: "${DGXMM_HOST_HOME:?set DGXMM_HOST_HOME in .env (run ./install.sh)}"
      DGXMM_TRUSTED_PROXIES: "${DGXMM_TRUSTED_PROXIES:-}"  # empty → config.yaml/default
      DGXMM_INSTALL_ID: "${DGXMM_INSTALL_ID:-}"  # labels this install's images/containers (dgxmm.install)
      DGXMM_TZ: "${DGXMM_TZ:-}"   # the host's time zone (install.sh detects it): daily/weekly schedules
      TZ: "${DGXMM_TZ:-UTC}"      # same zone for the container's local time (logs)
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - "${DGXMM_BIND:-0.0.0.0}:${DGXMM_PORT:-8090}:8090"
    networks: [dgxmm]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /etc/passwd:/host/etc/passwd:ro   # uid → user name in the Processes view (read-only; no shadow)
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - "${DGXMM_HF_CACHE:?set DGXMM_HF_CACHE in .env (run ./install.sh)}:/data/hf"
      - "${DGXMM_MODELS_DIR:?set DGXMM_MODELS_DIR in .env (run ./install.sh)}:/data/gguf/0"
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/dgxmm/').status==200 else 1)"]
      interval: 10s               # short so ./install.sh sees "healthy" soon after start
      timeout: 5s
      retries: 3
      start_period: 120s          # failures while starting do not count
    secrets: [litellm_master_key, hf_token]

  dgxmm-litellm-db:
    profiles: [litellm]
    # Postgres 16.15 (what postgres:16 resolved to when pinned; multi-arch index). Stay on major 16: the data
    # directory data/litellm-db is tied to it.
    image: postgres:16.15-trixie@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    restart: unless-stopped
    # Runs as the DGXMM user so data/litellm-db stays owned by it (install.sh creates it, mode 700).
    user: "${DGXMM_UID:?set DGXMM_UID in .env (run ./install.sh)}:${DGXMM_GID:?set DGXMM_GID in .env (run ./install.sh)}"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD_FILE: /run/secrets/litellm_db_password
    # No published port. Containers on the shared network can reach it, so it is password-protected.
    networks: [dgxmm]
    volumes:
      - ./data/litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "litellm", "-d", "litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets: [litellm_db_password]

  dgxmm-litellm:
    profiles: [litellm]
    # Pinned release (multi-arch index: linux/arm64 + linux/amd64).
    image: ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    restart: unless-stopped
    depends_on:
      dgxmm-litellm-db:
        condition: service_healthy
    # LiteLLM reads its keys from the environment; load them from the secret files at start so
    # they never appear in .env, the compose file or `docker inspect`.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        LITELLM_MASTER_KEY=$$(cat /run/secrets/litellm_bundled_master_key)
        LITELLM_SALT_KEY=$$(cat /run/secrets/litellm_salt_key)
        DATABASE_URL="postgresql://litellm:$$(cat /run/secrets/litellm_db_password)@dgxmm-litellm-db:5432/litellm"
        export LITELLM_MASTER_KEY LITELLM_SALT_KEY DATABASE_URL
        exec docker/prod_entrypoint.sh "$$@"
      - dgxmm-litellm
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      STORE_MODEL_IN_DB: "True"
    ports:
      - "${DGXMM_BIND:-0.0.0.0}:${DGXMM_LITELLM_PORT:-4000}:4000"
    networks: [dgxmm]
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s          # first start runs the database migrations
    # Its own master key (never the key of an external LiteLLM that DGXMM may also use).
    secrets: [litellm_bundled_master_key, litellm_salt_key, litellm_db_password]

networks:
  dgxmm:
    name: "${DGXMM_NETWORK:-dgxmm}"
    external: true                # created by ./install.sh if missing

secrets:
  litellm_master_key:
    file: ./secrets/litellm_master_key
  hf_token:
    file: ./secrets/hf_token
  litellm_bundled_master_key:     # profile litellm only (generated by ./install.sh --with-litellm)
    file: ./secrets/litellm_bundled_master_key
  litellm_salt_key:               # profile litellm only
    file: ./secrets/litellm_salt_key
  litellm_db_password:            # profile litellm only
    file: ./secrets/litellm_db_password
