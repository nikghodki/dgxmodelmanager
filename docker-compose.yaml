# DGXMM service. Host-specific values come from .env (generated by ./install.sh; see .env keys
# below). Run ./install.sh rather than editing this file.
services:
  dgxmm:
    build: .
    image: dgxmm:latest
    container_name: dgxmm
    restart: unless-stopped
    # Run as the host user that owns data/, secrets/ and the model caches.
    user: "${DGXMM_UID:?set DGXMM_UID in .env (run ./install.sh)}:${DGXMM_GID:?set DGXMM_GID in .env (run ./install.sh)}"
    group_add: ["${DOCKER_GID:?set DOCKER_GID (gid of /var/run/docker.sock) in .env (run ./install.sh)}"]
    runtime: nvidia               # NVML for per-process GPU memory / util
    environment:
      DGXMM_CONFIG: /app/config.yaml
      DGXMM_HOST_HOME: "${DGXMM_HOST_HOME:?set DGXMM_HOST_HOME in .env (run ./install.sh)}"
      DGXMM_TRUSTED_PROXIES: "${DGXMM_TRUSTED_PROXIES:-}"  # empty → config.yaml/default
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - "${DGXMM_BIND:-0.0.0.0}:${DGXMM_PORT:-8090}:8090"
    networks: [dgxmm]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - "${DGXMM_HF_CACHE:?set DGXMM_HF_CACHE in .env (run ./install.sh)}:/data/hf"
      - "${DGXMM_MODELS_DIR:?set DGXMM_MODELS_DIR in .env (run ./install.sh)}:/data/gguf/0"
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/dgxmm/').status==200 else 1)"]
      interval: 10s               # short so ./install.sh sees "healthy" soon after start
      timeout: 5s
      retries: 3
      start_period: 120s          # failures while starting do not count
    secrets: [litellm_master_key, hf_token]

networks:
  dgxmm:
    name: "${DGXMM_NETWORK:-dgxmm}"
    external: true                # created by ./install.sh if missing

secrets:
  litellm_master_key:
    file: ./secrets/litellm_master_key
  hf_token:
    file: ./secrets/hf_token
