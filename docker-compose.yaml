services:
  dgxmm:
    build: .
    image: dgxmm:latest
    container_name: dgxmm
    restart: unless-stopped
    user: "1000:1000"
    group_add: ["988"]            # docker group on spark-83dc (docker.sock access)
    runtime: nvidia               # NVML for per-process GPU memory / util
    environment:
      DGXMM_CONFIG: /app/config.yaml
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: utility
    ports:
      - "127.0.0.1:8090:8090"
    networks: [gateway]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
      - /home/nikghodki-dgx/.cache/huggingface:/data/hf
      - /home/nikghodki-dgx/models:/data/gguf/0
      - ./data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    secrets: [litellm_master_key, hf_token]

networks:
  gateway:
    external: true

secrets:
  litellm_master_key:
    file: ./secrets/litellm_master_key
  hf_token:
    file: ./secrets/hf_token
