name: Pylint

on: [push]

# least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]  # pyproject: requires-python >= 3.12
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@3542bca2639a428e1796aaa6a2ffef0c0f575566  # v3 (v3.1.4)
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pylint  # the package's dependencies, so imports resolve
    - name: Analysing the code with pylint
      run: |
        # errors only, configured in pyproject.toml ([tool.pylint]); style follows CONTRIBUTING.md
        pylint --errors-only dgxmm
