name: Pylint

on: [push]

# least privilege: the job only reads the repository
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]  # pyproject: requires-python >= 3.12
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pylint  # the package's dependencies, so imports resolve
    - name: Analysing the code with pylint
      run: |
        # errors only, configured in pyproject.toml ([tool.pylint]); style follows CONTRIBUTING.md
        pylint --errors-only dgxmm
