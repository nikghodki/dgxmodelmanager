name: Documentation site

# Builds the MkDocs site from docs/ and publishes it to https://nikghodki.github.io/dgxmodelmanager/
# (Settings > Pages > Source: GitHub Actions). Pull requests build it in the tests workflow's docs job.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# least privilege: only the deploy job may write to Pages
permissions:
  contents: read

# one deployment at a time; a newer push waits instead of cancelling a deployment in progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      NO_MKDOCS_2_WARNING: "1"  # Material's notice about MkDocs 2.0; this site pins MkDocs 1.6
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.12"
    - name: Install MkDocs (pinned with hashes)
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-docs.txt
    - name: Build the site (fails on any warning, broken link or anchor)
      # docs/overrides/hooks/mermaid.py adds the pinned, integrity-checked mermaid.min.js to the site
      run: mkdocs build --strict
    - name: Upload the site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
