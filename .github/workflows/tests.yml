name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Run backend tests
      # the whole suite: backend, installer (against stub commands), docs links and repository hygiene
      # (tests/test_repo_hygiene.py, tests/test_public_repo.py)
      run: |
        pytest -q

  frontend:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node-version: ["22"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
      with:
        node-version: ${{ matrix.node-version }}
        package-manager-cache: false
    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci
    - name: Run frontend tests
      working-directory: frontend
      run: npx vitest run
    - name: Build frontend
      working-directory: frontend
      run: npm run build  # tsc --noEmit, then vite build

  docs:
    # the documentation site (mkdocs.yml) as pages.yml builds it, without publishing
    runs-on: ubuntu-24.04
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: "3.12"
    - name: Install MkDocs (pinned with hashes)
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements-docs.txt
    - name: Build the site (fails on any warning, broken link or anchor)
      run: mkdocs build --strict

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
    - name: Shellcheck the installer, its test stubs and the scripts
      # pinned image (koalaman/shellcheck:v0.11.0, multi-arch index), not the runner's shellcheck version
      run: |
        docker run --rm -v "$PWD:/mnt:ro" -w /mnt \
          koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d \
          install.sh tests/fixtures/install_stubs/* deploy/decider/entrypoint.sh scripts/*.sh
