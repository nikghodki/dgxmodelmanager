<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>DGX Model Manager</title>
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors applyTheme() in src/components/app/theme.tsx.
      (function () {
        try {
          var t = localStorage.getItem("dgxmm-theme") || "system";
          t = (t === "light" || t === "dark" || t === "system") ? t : "system";
          var dark = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
