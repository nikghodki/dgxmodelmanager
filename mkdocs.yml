# Documentation site: https://nikghodki.github.io/dgxmodelmanager/
# Build: pip install -r requirements-docs.txt && mkdocs build --strict   (published by .github/workflows/pages.yml)
site_name: DGX Model Manager
site_description: Self-hosted serving of local LLMs on an NVIDIA DGX Spark, with a memory check before every start.
site_url: https://nikghodki.github.io/dgxmodelmanager/
repo_url: https://github.com/nikghodki/dgxmodelmanager
repo_name: nikghodki/dgxmodelmanager
edit_uri: edit/main/docs/
copyright: Copyright &copy; DGXMM contributors. Released under the MIT License.

docs_dir: docs
# docs/README.md is the directory's GitHub landing page; the site starts at index.md.
# docs/superpowers/ is the design history (linked on GitHub, not published); docs/overrides/ holds the theme overrides.
exclude_docs: |
  README.md
  superpowers/
  overrides/

strict: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  font: false  # system fonts: nothing is loaded from Google Fonts
  favicon: assets/favicon.svg
  icon:
    logo: dgxmm/logo  # docs/overrides/.icons/dgxmm/logo.svg, inlined so it takes the header's colour
    repo: fontawesome/brands/github
    edit: material/pencil
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - assets/stylesheets/extra.css
# Mermaid is served from the site itself (fetched and checked by docs/overrides/hooks/mermaid.py), so the theme
# never loads it from a CDN.
extra_javascript:
  - assets/javascripts/mermaid.min.js

hooks:
  - docs/overrides/hooks/root_files.py
  - docs/overrides/hooks/mermaid.py
  - docs/overrides/hooks/html_images.py

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      # GitHub's heading ids, so the same #anchors work on github.com and on the site
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - Getting started:
      - getting-started/features.md
      - getting-started/requirements.md
      - getting-started/install.md
      - getting-started/first-login.md
      - getting-started/upgrade.md
      - getting-started/uninstall.md
  - User guide:
      - user-guide/dashboard.md
      - user-guide/models.md
      - user-guide/deploying.md
      - user-guide/deployments.md
      - user-guide/insights.md
      - user-guide/schedules.md
      - user-guide/command-palette.md
      - user-guide/decision-model.md
      - user-guide/litellm.md
      - user-guide/calling-models.md
      - user-guide/processes.md
      - user-guide/users.md
      - user-guide/settings.md
  - Architecture:
      - architecture/index.md
      - architecture/request-flow.md
      - architecture/memory.md
      - architecture/deployer.md
      - architecture/decision-model.md
      - architecture/insights-jobs.md
      - architecture/schedules.md
      - architecture/litellm.md
      - architecture/storage.md
      - architecture/processes.md
      - architecture/background-loops.md
      - architecture/data-model.md
      - architecture/frontend.md
  - Configuration:
      - configuration/index.md
      - configuration/models-and-engines.md
      - configuration/networking.md
      - configuration/litellm.md
      - configuration/decision-model.md
  - Operations:
      - Overview: operations.md
      - operations/backup.md
      - operations/monitoring.md
      - operations/admin-cli.md
      - operations/decision-model.md
      - operations/troubleshooting.md
      - operations/known-limitations.md
  - Security:
      - security/overview.md
      - Threat model: security.md
      - security/application.md
      - security/hardening.md
      - security/reporting.md
  - Evaluation: decider-evaluation.md
  - Contributing:
      - contributing/index.md
      - contributing/design-history.md
  - Changelog: changelog.md
